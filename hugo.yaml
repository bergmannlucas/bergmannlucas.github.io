baseURL: "https://bergmannlucas.github.io/"
title: "Lucas Bergmann"

locale: pt-BR
defaultContentLanguage: pt-br

enableRobotsTXT: true
enableGitInfo: true

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

markup:
  highlight:
    noClasses: true
    style: github
    lineNos: false
  goldmark:
    renderer:
      unsafe: true

enableInlineShortcodes: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

menu:
  main:
    - name: Posts
      pageRef: /posts
      weight: 1
    - name: Snippets
      pageRef: /snippets
      weight: 2
    - name: Sobre
      pageRef: /about
      weight: 3
    - name: GitHub
      weight: 4
      url: "https://github.com/bergmannlucas"
      params:
        external: true

params:
  description: Blog pessoal de Lucas Bergmann — notas sobre software e outras coisas.

  author:
    name: Lucas Bergmann
    initials: LB
    role: Desenvolvedor de software
    bio: Escrevendo há alguns anos

  theme:
    default: system

  comments:
    enable: true
    giscus:
      repo: bergmannlucas/bergmannlucas.github.io
      repoId: "R_kgDOTmmFQQ"
      category: General
      categoryId: "DIC_kwDOTmmFQc4DCMSk"
      mapping: pathname
      reactionsEnabled: 1
      inputPosition: top
      lang: pt
