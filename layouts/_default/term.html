{{ define "main" }}
<section class="pt-16 pb-8">
  <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight mb-3">
    #{{ .Title }}
  </h1>
  <p class="text-text-muted dark:text-text-muted-dark">
    {{ len .Pages }} {{ if eq (len .Pages) 1 }}post{{ else }}posts{{ end }} com esta tag.
  </p>
</section>

<section class="pb-12">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" . }}
  {{ else }}
    <p class="py-12 text-text-muted dark:text-text-muted-dark">Nenhum post com esta tag.</p>
  {{ end }}
</section>
{{ end }}
