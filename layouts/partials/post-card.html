<article class="py-10 border-b border-border dark:border-border-dark last:border-b-0">
  <div class="flex items-center gap-3 mb-3 font-mono text-xs uppercase tracking-widest text-text-muted dark:text-text-muted-dark">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date.html" . }}</time>
    {{ with .Params.tags }}
      <span class="w-8 h-px bg-border dark:bg-border-dark"></span>
      {{ range first 1 . }}
        <a href="{{ "/tags/" | relURL }}{{ . | urlize }}" class="text-accent dark:text-accent-dark hover:underline">{{ . }}</a>
      {{ end }}
    {{ end }}
  </div>

  <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight mb-3">
    <a href="{{ .RelPermalink }}" class="hover:text-accent dark:hover:text-accent-dark transition-colors">
      {{ .Title }}
    </a>
  </h2>

  {{ if .Summary }}
    <div class="text-text-muted dark:text-text-muted-dark text-lg leading-relaxed mb-4">
      {{ .Summary }}
    </div>
  {{ end }}

  <a href="{{ .RelPermalink }}" class="inline-flex items-center gap-2 font-mono text-sm text-text dark:text-text-dark hover:text-accent dark:hover:text-accent-dark transition-colors group">
    Ler artigo completo
    <span class="group-hover:translate-x-1 transition-transform">→</span>
  </a>
</article>
